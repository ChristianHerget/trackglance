name: Publish CI images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ci-images.yml
      - tools/ci-image-key
      - tools/publish-ci-images
      - tools/resolve-ci-image
      - tools/verify-ci-image
      - tools/podman-test
      - tools/podman/release-metadata.sh
      - tools/podman/test_published_images.py
      - tools/podman/test_ci_image_publication.py
      - tools/podman/Containerfile.acceptance-runner
      - tools/podman/Containerfile.build
      - tools/podman/Containerfile.codeql-kotlin
      - tools/podman/Containerfile.emulator
      - tools/podman/Containerfile.generator
      - tools/podman/android-emulator-entrypoint.sh
      - tools/podman/build-coreapp.sh
      - tools/podman/coreapp-x86_64.patch
      - tools/podman/patches/android-emulator-dest-path.patch
      - tools/podman/versions.env
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ci-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ci-images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      ACCEPTANCE_CONTAINER_ENGINE: docker
      DEV_CONTAINER_ENGINE: docker
      GH_TOKEN: ${{ github.token }}
      ACCEPTANCE_RUNNER_REPOSITORY: ghcr.io/christianherget/trackglance-acceptance-runner
      ACCEPTANCE_EMULATOR_REPOSITORY: ghcr.io/christianherget/trackglance-acceptance-emulator
      CODEQL_KOTLIN_REPOSITORY: ghcr.io/christianherget/trackglance-codeql-kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify existing images and publish missing images
        id: publish
        run: tools/publish-ci-images
      - name: Generate acceptance runner SBOM
        if: steps.publish.outputs.runner_published == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish.outputs.runner_ref }}
          format: spdx-json
          output-file: build/acceptance-runner.spdx.json
          upload-artifact: false
      - name: Generate acceptance emulator SBOM
        if: steps.publish.outputs.emulator_published == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish.outputs.emulator_ref }}
          format: spdx-json
          output-file: build/acceptance-emulator.spdx.json
          upload-artifact: false
      - name: Generate Kotlin CodeQL SBOM
        if: steps.publish.outputs.codeql_published == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish.outputs.codeql_ref }}
          format: spdx-json
          output-file: build/codeql-kotlin.spdx.json
          upload-artifact: false
      - name: Attest acceptance runner provenance
        if: steps.publish.outputs.runner_published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.ACCEPTANCE_RUNNER_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.runner_digest }}
          push-to-registry: true
      - name: Attest acceptance runner SBOM
        if: steps.publish.outputs.runner_published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.ACCEPTANCE_RUNNER_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.runner_digest }}
          sbom-path: build/acceptance-runner.spdx.json
          push-to-registry: true
      - name: Attest acceptance emulator provenance
        if: steps.publish.outputs.emulator_published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.ACCEPTANCE_EMULATOR_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.emulator_digest }}
          push-to-registry: true
      - name: Attest acceptance emulator SBOM
        if: steps.publish.outputs.emulator_published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.ACCEPTANCE_EMULATOR_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.emulator_digest }}
          sbom-path: build/acceptance-emulator.spdx.json
          push-to-registry: true
      - name: Attest Kotlin CodeQL provenance
        if: steps.publish.outputs.codeql_published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CODEQL_KOTLIN_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.codeql_digest }}
          push-to-registry: true
      - name: Attest Kotlin CodeQL SBOM
        if: steps.publish.outputs.codeql_published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CODEQL_KOTLIN_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.codeql_digest }}
          sbom-path: build/codeql-kotlin.spdx.json
          push-to-registry: true
      - name: Report immutable references and publication results
        run: cat build/ci-image-publication-summary.md >> "$GITHUB_STEP_SUMMARY"
