name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_CONTAINER_ENGINE: docker
  ACCEPTANCE_CONTAINER_ENGINE: docker
  CI_PUBLISHED_TOOLS: 'true'
  GH_TOKEN: ${{ github.token }}

jobs:
  synthetic:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: android
            name: Android synthetic runtime
          - component: watch
            name: Watch synthetic runtime
          - component: helpers
            name: Helpers and policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dev-container-cache
          key: synthetic-${{ runner.os }}-${{ matrix.component }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', '**/package-lock.json', 'tools/ci-images.env') }}
          restore-keys: synthetic-${{ runner.os }}-${{ matrix.component }}-
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - name: Grant access to KVM
        if: matrix.component == 'android'
        run: |
          sudo setfacl -m "u:${USER}:rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Run synthetic component
        env:
          SYNTHETIC_COMPONENT: ${{ matrix.component }}
        run: tools/podman-test synthetic "$SYNTHETIC_COMPONENT"
      - name: Check release packaging
        if: matrix.component == 'android'
        run: tools/podman-test release-check
      - name: Print bounded failure diagnostics
        if: failure()
        run: tools/check-diagnostics
      - name: Restore cache ownership
        if: always()
        run: |
          mkdir -p build/dev-container-cache
          sudo chown -R "$(id -u):$(id -g)" build/dev-container-cache
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/check-logs
          if-no-files-found: warn
          retention-days: 7

  documentation:
    name: Committed documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - name: Validate committed documentation
        run: tools/podman-test documentation
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/check-logs
          retention-days: 7

  complete:
    name: Synthetic CI
    needs: [synthetic, documentation]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every synthetic component and documentation
        env:
          SYNTHETIC_RESULT: ${{ needs.synthetic.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: |
          test "$SYNTHETIC_RESULT" = success
          test "$DOCUMENTATION_RESULT" = success

  # Keep the existing protected check during rollout. Enable the new gate only
  # after synthetic checks pass, then set SYNTHETIC_CI_ENABLED=true.
  legacy-acceptance:
    if: vars.SYNTHETIC_CI_ENABLED != 'true'
    uses: ./.github/workflows/acceptance.yml
  legacy-static:
    name: Android, Pebble, protocol, and helpers
    needs: synthetic
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.synthetic.result }}
        run: test "$RESULT" = success
  legacy-complete:
    name: Hosted full-stack acceptance
    needs: legacy-acceptance
    if: always() && vars.SYNTHETIC_CI_ENABLED != 'true'
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.legacy-acceptance.result }}
        run: test "$RESULT" = success
