name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      watch_passes:
        description: Number of Emery/Gabbro passes for manual acceptance
        type: choice
        options: ['1', '2']
        default: '1'
        required: true
      acceptance_provisioning:
        description: Acceptance provisioning path
        type: choice
        options: [source, published, compare]
        default: published
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select main CI evidence
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      reason: ${{ steps.policy.outputs.reason }}
      source_run_id: ${{ steps.policy.outputs.source_run_id }}
      source_attempt: ${{ steps.policy.outputs.source_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select reuse or complete validation
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci-evidence decide

  static:
    name: Android, Pebble, protocol, and helpers
    needs: plan
    if: always() && needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the tested checkout
        run: tools/ci-evidence capture static
      - name: Run the public static entry point
        env:
          DEV_CONTAINER_ENGINE: docker
        run: tools/podman-test static
      - name: Assemble release and exclude debug provider
        env:
          DEV_CONTAINER_ENGINE: docker
        run: tools/podman-test release-check
      - name: Record post-test tracked inputs
        run: tools/ci-evidence finalize static
      - name: Upload tested checkout evidence
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence/static.json
          if-no-files-found: error
          retention-days: 7
      - name: Print bounded failure diagnostics
        if: failure()
        run: tools/check-diagnostics
      - name: Upload static and release diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/check-logs
          if-no-files-found: warn
          retention-days: 7

  documentation:
    name: Committed documentation
    needs: plan
    if: always() && needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the tested checkout
        run: tools/ci-evidence capture documentation
      - name: Validate docs without regenerating screenshots
        env:
          DEV_CONTAINER_ENGINE: docker
        run: tools/podman-test documentation
      - name: Record post-test tracked inputs
        run: tools/ci-evidence finalize documentation
      - name: Upload tested checkout evidence
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence/documentation.json
          if-no-files-found: error
          retention-days: 7
      - name: Print bounded failure diagnostics
        if: failure()
        run: tools/check-diagnostics
      - name: Upload documentation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/check-logs
          if-no-files-found: warn
          retention-days: 7

  acceptance-android:
    name: Android instrumentation
    needs: plan
    if: always() && needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ACCEPTANCE_COMPONENT: android
      ACCEPTANCE_CONTAINER_ENGINE: docker
      ACCEPTANCE_REPORT_RESOURCES: 1
      WATCH_PASSES: ${{ inputs.watch_passes || '1' }}
      ACCEPTANCE_PROVISIONING: ${{ inputs.acceptance_provisioning || 'published' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure ephemeral fixture location
        run: echo "LOCUS_APKS_DIR=$RUNNER_TEMP/locus-apks" >> "$GITHUB_ENV"
      - name: Report fresh hosted-runner resources
        run: |
          uname -a
          nproc
          free -h
          df -h
          docker version
          ls -l /dev/kvm
          docker system df
      - name: Grant this runner access to KVM
        run: |
          sudo setfacl -m "u:${USER}:rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Download the pinned public Locus fixture
        run: |
          mkdir -p "$LOCUS_APKS_DIR"
          tools/download-locus-apk --output "$LOCUS_APKS_DIR/locus.apk"
      - name: Verify checkout and downloaded fixture
        run: tools/ci-evidence capture "$ACCEPTANCE_COMPONENT" --fixture-path "$LOCUS_APKS_DIR/locus.apk"
      - name: Install the pinned image signature verifier
        if: env.ACCEPTANCE_PROVISIONING != 'source'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Run selected acceptance component
        run: |
          run_suite() {
            local label=$1 provisioning=$2 started elapsed report
            sudo setfacl -m "u:${USER}:rw" /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            started=$SECONDS
            timeout 110m tools/podman-test acceptance-suite \
              "$provisioning" --cleanup --watch-passes "$WATCH_PASSES" \
              --component "$ACCEPTANCE_COMPONENT"
            elapsed=$((SECONDS - started))
            echo "- $ACCEPTANCE_COMPONENT: $label provisioning, ${elapsed}s, all selected checkpoints passed" >> "$GITHUB_STEP_SUMMARY"
            report=$(cat build/check-logs/latest)
            awk -F '\t' '$3 == 0 { print "  - Passed: " $2 }' "$report/manifest.tsv" >> "$GITHUB_STEP_SUMMARY"
          }
          case "$ACCEPTANCE_PROVISIONING" in
            source) run_suite Source --fresh ;;
            published) run_suite Published --published ;;
            compare)
              echo '## Acceptance provisioning comparison' >> "$GITHUB_STEP_SUMMARY"
              run_suite Source --fresh
              run_suite Published --published
              ;;
            *) echo "Unknown provisioning path: $ACCEPTANCE_PROVISIONING" >&2; exit 2 ;;
          esac
      - name: Print bounded failure diagnostics
        if: failure()
        run: tools/check-diagnostics
      - name: Remove ephemeral fixture and any remaining acceptance state
        if: always()
        run: |
          status=0
          tools/podman-test clean || status=$?
          find "$LOCUS_APKS_DIR" -type f -delete 2>/dev/null || true
          rmdir "$LOCUS_APKS_DIR" 2>/dev/null || true
          docker system df
          exit "$status"
      - name: Record post-test tracked inputs
        run: tools/ci-evidence finalize android
      - name: Upload tested checkout evidence
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence/android.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload sanitized acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ env.ACCEPTANCE_COMPONENT }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/check-logs
          if-no-files-found: warn
          retention-days: 7

  acceptance-watch:
    name: Watch acceptance (${{ matrix.component }})
    needs: [plan, acceptance-android]
    if: always() && needs.plan.outputs.mode != 'reuse' && needs.acceptance-android.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        component: [emery, gabbro]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ACCEPTANCE_COMPONENT: ${{ matrix.component }}
      ACCEPTANCE_CONTAINER_ENGINE: docker
      ACCEPTANCE_REPORT_RESOURCES: 1
      WATCH_PASSES: ${{ inputs.watch_passes || '1' }}
      ACCEPTANCE_PROVISIONING: ${{ inputs.acceptance_provisioning || 'published' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure ephemeral fixture location
        run: echo "LOCUS_APKS_DIR=$RUNNER_TEMP/locus-apks" >> "$GITHUB_ENV"
      - name: Report fresh hosted-runner resources
        run: |
          uname -a
          nproc
          free -h
          df -h
          docker version
          ls -l /dev/kvm
          docker system df
      - name: Grant this runner access to KVM
        run: |
          sudo setfacl -m "u:${USER}:rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Download the pinned public Locus fixture
        run: |
          mkdir -p "$LOCUS_APKS_DIR"
          tools/download-locus-apk --output "$LOCUS_APKS_DIR/locus.apk"
      - name: Verify checkout and downloaded fixture
        run: tools/ci-evidence capture "$ACCEPTANCE_COMPONENT" --fixture-path "$LOCUS_APKS_DIR/locus.apk"
      - name: Install the pinned image signature verifier
        if: env.ACCEPTANCE_PROVISIONING != 'source'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Run selected acceptance component
        run: |
          run_suite() {
            local label=$1 provisioning=$2 started elapsed report
            sudo setfacl -m "u:${USER}:rw" /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            started=$SECONDS
            timeout 110m tools/podman-test acceptance-suite \
              "$provisioning" --cleanup --watch-passes "$WATCH_PASSES" \
              --component "$ACCEPTANCE_COMPONENT"
            elapsed=$((SECONDS - started))
            echo "- $ACCEPTANCE_COMPONENT: $label provisioning, ${elapsed}s, all selected checkpoints passed" >> "$GITHUB_STEP_SUMMARY"
            report=$(cat build/check-logs/latest)
            awk -F '\t' '$3 == 0 { print "  - Passed: " $2 }' "$report/manifest.tsv" >> "$GITHUB_STEP_SUMMARY"
          }
          case "$ACCEPTANCE_PROVISIONING" in
            source) run_suite Source --fresh ;;
            published) run_suite Published --published ;;
            compare)
              echo '## Acceptance provisioning comparison' >> "$GITHUB_STEP_SUMMARY"
              run_suite Source --fresh
              run_suite Published --published
              ;;
            *) echo "Unknown provisioning path: $ACCEPTANCE_PROVISIONING" >&2; exit 2 ;;
          esac
      - name: Print bounded failure diagnostics
        if: failure()
        run: tools/check-diagnostics
      - name: Remove ephemeral fixture and any remaining acceptance state
        if: always()
        run: |
          status=0
          tools/podman-test clean || status=$?
          find "$LOCUS_APKS_DIR" -type f -delete 2>/dev/null || true
          rmdir "$LOCUS_APKS_DIR" 2>/dev/null || true
          docker system df
          exit "$status"
      - name: Record post-test tracked inputs
        run: tools/ci-evidence finalize "$ACCEPTANCE_COMPONENT"
      - name: Upload tested checkout evidence
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence/${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload sanitized acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ env.ACCEPTANCE_COMPONENT }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/check-logs
          if-no-files-found: warn
          retention-days: 7

  acceptance-hosted:
    name: Hosted full-stack acceptance
    needs: [plan, acceptance-android, acceptance-watch]
    if: always() && needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Android and both watch components
        env:
          ANDROID_RESULT: ${{ needs.acceptance-android.result }}
          WATCH_RESULT: ${{ needs.acceptance-watch.result }}
        run: |
          test "$ANDROID_RESULT" = success
          test "$WATCH_RESULT" = success

  certify-main:
    name: Main commit certification
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [plan, static, documentation, acceptance-android, acceptance-watch, acceptance-hosted]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify main checks and write certification
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: tools/ci-evidence certify
      - name: Attest certification from trusted main context
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/ci-certification.json
          predicate-type: https://github.com/ChristianHerget/trackglance/ci-certification/v1
          predicate-path: build/ci-certification.json
      - name: Upload main certification record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-certification.json
          if-no-files-found: error
          retention-days: 90
