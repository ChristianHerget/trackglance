name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      certification-run-id: ${{ steps.certification.outputs.run_id }}
      certification-run-url: ${{ steps.certification.outputs.run_url }}
      source-commit: ${{ steps.certification.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require tag at current main HEAD
        run: tools/release-preflight "${GITHUB_REF_NAME}"
      - name: Require exact-SHA main-push certification
        id: certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$SECONDS
          tools/release-certification "${GITHUB_REF_NAME}"
          echo "- Exact-SHA certification wait: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Refuse to alter a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$state" = true || { echo "Release is already published." >&2; exit 1; }
          fi

  build-draft:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Start release timing
        run: echo "RELEASE_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install the pinned image signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Decode signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          mkdir -p build/release-private
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/release-private/trackglance-release.p12
      - name: Verify toolchain and build distributable artifacts
        env:
          DEV_CONTAINER_ENGINE: docker
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/build/release-private/trackglance-release.p12
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          started=$SECONDS
          tools/podman-test release-artifacts --published
          echo "- Toolchain verification and artifact compilation: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private signing key
        if: always()
        run: |
          find build/release-private -type f -delete 2>/dev/null || true
          rmdir build/release-private 2>/dev/null || true
      - name: Stage public assets
        id: assets
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p build/release-assets
          cp android/app/build/outputs/apk/release/trackglance-bridge-release.apk "build/release-assets/trackglance-bridge-$version.apk"
          cp watchapp/build/watchapp.pbw "build/release-assets/trackglance-watch-$version.pbw"
          cp trackglance-release-certificate.pem build/release-assets/
          cp trackglance-release-certificate.sha256 build/release-assets/
          android_cdx="build/release-assets/trackglance-bridge-$version.cdx.json"
          android_spdx="build/release-assets/trackglance-bridge-$version.spdx.json"
          watch_cdx="build/release-assets/trackglance-watch-$version.cdx.json"
          watch_spdx="build/release-assets/trackglance-watch-$version.spdx.json"
          cp "build/release-sboms/trackglance-bridge-$version.cdx.json" "$android_cdx"
          cp "build/release-sboms/trackglance-bridge-$version.spdx.json" "$android_spdx"
          cp "build/release-sboms/trackglance-watch-$version.cdx.json" "$watch_cdx"
          cp "build/release-sboms/trackglance-watch-$version.spdx.json" "$watch_spdx"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "build/release-assets/trackglance-docs-$version.tar.gz" -C docs/sphinx/_build/html .
          (cd build/release-assets && sha256sum ./* > SHA256SUMS)
          tools/verify-release-assets build/release-assets "$version"
          {
            printf 'android_cdx=%s\n' "$android_cdx"
            printf 'android_spdx=%s\n' "$android_spdx"
            printf 'watch_cdx=%s\n' "$watch_cdx"
            printf 'watch_spdx=%s\n' "$watch_spdx"
          } >> "$GITHUB_OUTPUT"
      - name: Attest APK provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release-assets/*.apk
      - name: Attest PBW provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release-assets/*.pbw
      - name: Attest APK CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release-assets/*.apk
          sbom-path: ${{ steps.assets.outputs.android_cdx }}
      - name: Attest APK SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release-assets/*.apk
          sbom-path: ${{ steps.assets.outputs.android_spdx }}
      - name: Attest PBW CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release-assets/*.pbw
          sbom-path: ${{ steps.assets.outputs.watch_cdx }}
      - name: Attest PBW SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release-assets/*.pbw
          sbom-path: ${{ steps.assets.outputs.watch_spdx }}
      - name: Attest documentation provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release-assets/trackglance-docs-*.tar.gz
      - name: Generate release notes
        env:
          CERTIFICATION_RUN_ID: ${{ needs.preflight.outputs.certification-run-id }}
          CERTIFICATION_RUN_URL: ${{ needs.preflight.outputs.certification-run-url }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source-commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/releases.json
          tools/release-notes "${GITHUB_REF_NAME#v}" \
            --releases-json build/releases.json > build/release-notes.md
          cat >> build/release-notes.md <<EOF

          Source commit: \`$SOURCE_COMMIT\`

          Certification: [$CERTIFICATION_RUN_ID]($CERTIFICATION_RUN_URL)

          Draft build: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          Verify a downloaded artifact with:

          \`gh attestation verify ARTIFACT --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF --source-digest $SOURCE_COMMIT --deny-self-hosted-runners\`

          Verify a downloaded artifact's CycloneDX SBOM with:

          \`gh attestation verify ARTIFACT --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF --source-digest $SOURCE_COMMIT --deny-self-hosted-runners --predicate-type https://cyclonedx.org/bom\`

          For SPDX, use predicate type \`https://spdx.dev/Document/v2.3\` instead. An SBOM is a component inventory, not a vulnerability-free guarantee.
          EOF
      - name: Start VirusTotal timing
        run: echo "VIRUSTOTAL_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Submit APK and PBW to VirusTotal
        id: virustotal
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          files: |
            ./build/release-assets/*.apk
            ./build/release-assets/*.pbw
          request_rate: 4
          update_release_body: false
      - name: Validate VirusTotal reports and add submission badges
        env:
          VIRUSTOTAL_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: tools/append-virustotal-badges "${GITHUB_REF_NAME#v}" build/release-notes.md
      - name: Recheck tag at current main HEAD
        run: tools/release-preflight "${GITHUB_REF_NAME}"
      - name: Record release timings
        run: |
          now=$(date +%s)
          echo "- VirusTotal submission and validation: $((now - VIRUSTOTAL_STARTED))s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Protected artifact job total: $((now - RELEASE_JOB_STARTED))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft --title "TrackGlance ${GITHUB_REF_NAME#v}" --notes-file build/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "TrackGlance ${GITHUB_REF_NAME#v}" --notes-file build/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" ./build/release-assets/* --clobber
