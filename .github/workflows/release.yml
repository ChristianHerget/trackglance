name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: tools/release-preflight "${GITHUB_REF_NAME}"

  build-draft:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse to alter a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$state" = true || { echo "Release is already published." >&2; exit 1; }
          fi
      - name: Decode signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          mkdir -p build/release-private
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/release-private/trackglance-release.p12
      - name: Build and validate signed release
        env:
          DEV_CONTAINER_ENGINE: docker
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/build/release-private/trackglance-release.p12
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          tools/podman-test static
          tools/podman-test documentation
          tools/podman-test release-check
      - name: Stage public assets and remove private key
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p build/release-assets
          cp android/app/build/outputs/apk/release/trackglance-bridge-release.apk "build/release-assets/trackglance-bridge-$version.apk"
          cp watchapp/build/watchapp.pbw "build/release-assets/trackglance-watch-$version.pbw"
          cp trackglance-release-certificate.pem build/release-assets/
          cp trackglance-release-certificate.sha256 build/release-assets/
          (cd build/release-assets && sha256sum * > SHA256SUMS)
          rm -f build/release-private/trackglance-release.p12
          rmdir build/release-private
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft --title "TrackGlance ${GITHUB_REF_NAME#v}" --notes-file RELEASE.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "TrackGlance ${GITHUB_REF_NAME#v}" --notes-file RELEASE.md
          fi
          gh release upload "$GITHUB_REF_NAME" build/release-assets/* --clobber
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/sphinx/_build/html

  deploy-pages:
    needs: build-draft
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  publish:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release edit "$GITHUB_REF_NAME" --draft=false
